aid: polimorphic
name: Polimorphic
description: >-
  Polimorphic is a New York-based government technology company building a complete AI platform for
  local, county, state, and federal government service delivery. Its product suite pairs a Constituent
  Relationship Manager (CRM) with an AI Chatbot & Search, a Voice Agent (VoiceAI), and Workflows so
  public agencies can answer residents 24/7 in 75+ languages and guide them through permits, licenses,
  applications, and payments from intake to resolution. Polimorphic connects to existing government
  systems of record (ArcGIS, Tyler, Accela, Salesforce, Laserfiche, Stripe, and more) and is used by
  200+ public-sector departments serving tens of millions of residents. Founded by Parth Shah (CEO) and
  Daniel Smith (CTO), the company is backed by General Catalyst, M13, and Shine.
